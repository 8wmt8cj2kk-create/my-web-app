<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .settings-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }
        
        .settings-header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }
        
        .settings-title {
            flex: 1;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        
        .settings-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .settings-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .settings-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .settings-item:active {
            background: #f5f5f5;
        }
        
        .settings-item:last-child {
            border-bottom: none;
        }
        
        .settings-icon {
            width: 40px;
            height: 40px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .settings-info {
            flex: 1;
        }
        
        .settings-name {
            font-weight: bold;
            color: #222;
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .settings-desc {
            font-size: 12px;
            color: #999;
        }
        
        .settings-arrow {
            font-size: 20px;
            color: #ccc;
        }
        
        .danger-item .settings-name {
            color: #d32f2f;
        }
        
        .danger-item .settings-icon {
            background: #ffebee;
            color: #d32f2f;
        }
        
        .user-info-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            overflow: hidden;
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-nickname {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        
        .user-username {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .user-uid {
            font-size: 11px;
            color: #bbb;
            margin-top: 2px;
        }
        
        .bottom-tabbar {
            height: 8%;
            min-height: 60px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px;
        }
        
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 0;
            cursor: pointer;
            border-radius: 12px;
        }
        
        .tab-item:active {
            background: #f0f0f0;
        }
        
        .tab-icon {
            font-size: 24px;
        }
        
        .tab-label {
            font-size: 11px;
            color: #999;
        }
        
        .tab-item.active .tab-label {
            color: #222;
            font-weight: bold;
        }
        
        /* 用户管理表格样式 */
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .user-table th {
            background: #222;
            color: white;
            padding: 10px;
            font-size: 13px;
        }
        
        .user-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        
        .ban-select {
            padding: 5px;
            font-size: 11px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        
        .ban-reason {
            width: 80px;
            padding: 4px;
            font-size: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 4px;
        }
        
        .ban-btn {
            padding: 3px 8px;
            font-size: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
        
        .avatar-select {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        
        .avatar-opt {
            width: 50px;
            height: 50px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .avatar-opt.selected {
            border-color: #222;
            background: #e0e0e0;
            transform: scale(1.05);
        }
        
        .avatar-opt:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <button class="back-btn" onclick="window.location.href='chat.html'">←</button>
            <div class="settings-title">⚙️ 设置</div>
        </div>
        
        <div class="settings-list">
            <!-- 用户信息卡片 -->
            <div class="user-info-card" id="userInfoCard">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-details">
                    <div class="user-nickname" id="userNickname">加载中...</div>
                    <div class="user-username" id="userUsername">@...</div>
                    <div class="user-uid" id="userUid">ID: ...</div>
                </div>
            </div>
            
            <!-- 设置选项 -->
            <div class="settings-card">
                <div class="settings-item" data-action="avatar">
                    <div class="settings-icon">🖼️</div>
                    <div class="settings-info">
                        <div class="settings-name">编辑个人信息</div>
                        <div class="settings-desc">修改昵称、头像</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
                
                <div class="settings-item" data-action="password">
                    <div class="settings-icon">🔒</div>
                    <div class="settings-info">
                        <div class="settings-name">密码修改</div>
                        <div class="settings-desc">修改登录密码</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
                
                <div class="settings-item" data-action="online">
                    <div class="settings-icon">👥</div>
                    <div class="settings-info">
                        <div class="settings-name">在线人数</div>
                        <div class="settings-desc">查看当前在线用户</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
                
                <div class="settings-item" data-action="gamecenter">
                    <div class="settings-icon">🎮</div>
                    <div class="settings-info">
                        <div class="settings-name">游戏中心</div>
                        <div class="settings-desc">弹球游戏、枪战肉鸽</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
            </div>
            
            <!-- 管理员专用 -->
            <div id="adminSection" style="display: none;">
                <div class="settings-card">
                    <div class="settings-item" data-action="allusers">
                        <div class="settings-icon">📋</div>
                        <div class="settings-info">
                            <div class="settings-name">用户管理</div>
                            <div class="settings-desc">封禁/解封用户</div>
                        </div>
                        <div class="settings-arrow">›</div>
                    </div>
                    
                    <div class="settings-item" data-action="alluserspw">
                        <div class="settings-icon">🔐</div>
                        <div class="settings-info">
                            <div class="settings-name">查看所有账号密码</div>
                            <div class="settings-desc">仅管理员可见</div>
                        </div>
                        <div class="settings-arrow">›</div>
                    </div>
                </div>
            </div>
            
            <!-- 账号操作 -->
            <div class="settings-card">
                <div class="settings-item danger-item" data-action="delete">
                    <div class="settings-icon">🗑️</div>
                    <div class="settings-info">
                        <div class="settings-name">注销账号</div>
                        <div class="settings-desc">永久删除账号，不可恢复</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
                
                <div class="settings-item" data-action="logout">
                    <div class="settings-icon">🚪</div>
                    <div class="settings-info">
                        <div class="settings-name">退出登录</div>
                        <div class="settings-desc">退出当前账号</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
                
                <div class="settings-item" data-action="switch">
                    <div class="settings-icon">🔄</div>
                    <div class="settings-info">
                        <div class="settings-name">切换账号</div>
                        <div class="settings-desc">登录其他账号</div>
                    </div>
                    <div class="settings-arrow">›</div>
                </div>
            </div>
        </div>
        
        <!-- 底部任务栏 -->
        <div class="bottom-tabbar">
            <div class="tab-item" data-tab="chat">
                <div class="tab-icon">💬</div>
                <div class="tab-label">消息</div>
            </div>
            <div class="tab-item" data-tab="games">
                <div class="tab-icon">🎮</div>
                <div class="tab-label">游戏中心</div>
            </div>
            <div class="tab-item active" data-tab="settings">
                <div class="tab-icon">⚙️</div>
                <div class="tab-label">设置</div>
            </div>
        </div>
    </div>
    
    <script>
        // ========== 通用函数 ==========
        
        // 获取当前用户
        function getCurrentUser() {
            const user = sessionStorage.getItem('currentUser');
            return user ? JSON.parse(user) : null;
        }
        
        // 显示弹窗
        function showModal(title, contentHtml, onConfirm, confirmText = '确认') {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1002;';
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: white; border-radius: 20px; z-index: 1003; overflow: hidden; max-height: 80vh;';
            modal.innerHTML = `
                <div style="padding: 20px; background: #f8f8f8; border-bottom: 1px solid #eee; text-align: center;">
                    <h3 style="margin: 0;">${title}</h3>
                </div>
                <div style="padding: 20px; overflow-y: auto; max-height: 60vh;">
                    ${contentHtml}
                </div>
                <div style="padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: center;">
                    <button id="modalConfirmBtn" style="padding: 10px 20px; background: #222; color: white; border: none; border-radius: 10px; cursor: pointer;">${confirmText}</button>
                    <button id="modalCancelBtn" style="padding: 10px 20px; background: #f0f0f0; color: #333; border: none; border-radius: 10px; cursor: pointer;">取消</button>
                </div>
            `;
            
            document.body.appendChild(overlay);
            document.body.appendChild(modal);
            
            document.getElementById('modalCancelBtn').addEventListener('click', () => {
                modal.remove();
                overlay.remove();
            });
            overlay.addEventListener('click', () => {
                modal.remove();
                overlay.remove();
            });
            
            if (onConfirm) {
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    onConfirm();
                    modal.remove();
                    overlay.remove();
                });
            }
        }
        
        // 简单弹窗
        function showAlert(title, message) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1002;';
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: white; border-radius: 20px; z-index: 1003; overflow: hidden;';
            modal.innerHTML = `
                <div style="padding: 20px; text-align: center; border-bottom: 1px solid #eee;">
                    <h3 style="margin: 0;">${title}</h3>
                </div>
                <div style="padding: 20px; text-align: center;">
                    <p>${message}</p>
                </div>
                <div style="padding: 15px 20px; text-align: center;">
                    <button id="closeBtn" style="padding: 8px 20px; background: #222; color: white; border: none; border-radius: 10px;">关闭</button>
                </div>
            `;
            
            document.body.appendChild(overlay);
            document.body.appendChild(modal);
            
            document.getElementById('closeBtn').addEventListener('click', () => {
                modal.remove();
                overlay.remove();
            });
            overlay.addEventListener('click', () => {
                modal.remove();
                overlay.remove();
            });
        }
        
        // 显示用户信息
        function displayUserInfo() {
            const user = getCurrentUser();
            if (user) {
                const avatar = user.avatar || '👤';
                const avatarDiv = document.getElementById('userAvatar');
                if (avatar.startsWith('/avatars/')) {
                    avatarDiv.innerHTML = `<img src="${avatar}" onerror="this.parentElement.innerHTML='👤'">`;
                } else {
                    avatarDiv.innerHTML = avatar;
                }
                document.getElementById('userNickname').innerText = user.nickname || user.username;
                document.getElementById('userUsername').innerText = '@' + user.username;
                document.getElementById('userUid').innerText = 'ID: ' + (user.uid || '未知');
                
                if (user.username === 'admin') {
                    document.getElementById('adminSection').style.display = 'block';
                }
            } else {
                window.location.href = 'login.html';
            }
        }
        
        // ========== 个人信息编辑 ==========
        
        // 头像列表
        const avatarList = ['👤', '😀', '😎', '🐱', '🐶', '🦊', '🐼', '🌟', '💀', '🤖', '👻', '🎃', '❤️', '⭐', '🔥', '🎉'];
        
        // 编辑个人信息
        function showAvatarSettings() {
            const user = getCurrentUser();
            if (!user) return;
            
            let currentAvatar = user.avatar || '👤';
            let currentNickname = user.nickname || user.username;
            
            let avatarHtml = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="font-size: 60px; margin-bottom: 10px;" id="previewAvatar">${currentAvatar.startsWith('/avatars/') ? '👤' : currentAvatar}</div>
                    <div style="font-weight: bold;" id="previewNickname">${currentNickname}</div>
                </div>
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>昵称</label>
                    <input type="text" id="nicknameInput" value="${currentNickname}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div class="avatar-select" id="avatarSelect">
            `;
            
            avatarList.forEach(avatar => {
                const isSelected = currentAvatar === avatar;
                avatarHtml += `
                    <div class="avatar-opt ${isSelected ? 'selected' : ''}" data-avatar="${avatar}">
                        ${avatar}
                    </div>
                `;
            });
            
            avatarHtml += `</div>`;
            
            showModal('编辑个人信息', avatarHtml, async () => {
                const newNickname = document.getElementById('nicknameInput').value.trim();
                let selectedAvatar = currentAvatar;
                const selected = document.querySelector('.avatar-opt.selected');
                if (selected) {
                    selectedAvatar = selected.getAttribute('data-avatar');
                }
                
                let success = true;
                if (newNickname && newNickname !== currentNickname) {
                    success = await updateUserInfo(user.username, { nickname: newNickname });
                }
                if (success && selectedAvatar !== currentAvatar && !selectedAvatar.startsWith('/avatars/')) {
                    success = await updateUserInfo(user.username, { avatar: selectedAvatar });
                }
                
                if (success) {
                    showAlert('成功', '个人信息已更新');
                    location.reload();
                }
            }, '保存');
            
            // 绑定头像选择事件
            setTimeout(() => {
                document.querySelectorAll('.avatar-opt').forEach(opt => {
                    opt.addEventListener('click', function() {
                        document.querySelectorAll('.avatar-opt').forEach(o => o.classList.remove('selected'));
                        this.classList.add('selected');
                        document.getElementById('previewAvatar').innerText = this.getAttribute('data-avatar');
                    });
                });
                document.getElementById('nicknameInput').addEventListener('input', function() {
                    document.getElementById('previewNickname').innerText = this.value || '昵称';
                });
            }, 100);
        }
        
        // 更新用户信息
        async function updateUserInfo(username, updates) {
            try {
                let url = `/updateUser?username=${encodeURIComponent(username)}`;
                if (updates.nickname) url += `&nickname=${encodeURIComponent(updates.nickname)}`;
                if (updates.avatar) url += `&avatar=${encodeURIComponent(updates.avatar)}`;
                
                const response = await fetch(url);
                const data = await response.json();
                if (data.success) {
                    const user = getCurrentUser();
                    if (user) {
                        if (updates.nickname) user.nickname = updates.nickname;
                        if (updates.avatar) user.avatar = updates.avatar;
                        sessionStorage.setItem('currentUser', JSON.stringify(user));
                    }
                    return true;
                } else {
                    showAlert('错误', data.error || '更新失败');
                    return false;
                }
            } catch (error) {
                showAlert('错误', '网络错误');
                return false;
            }
        }
        
        // 密码修改
        function showPasswordChange() {
            showModal('修改密码', `
                <input type="password" id="oldPwd" placeholder="请输入原密码" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 10px;">
                <input type="password" id="newPwd" placeholder="请输入新密码（至少3位）" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 10px;">
                <input type="password" id="confirmPwd" placeholder="请确认新密码" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px;">
            `, async () => {
                const oldPwd = document.getElementById('oldPwd').value;
                const newPwd = document.getElementById('newPwd').value;
                const confirmPwd = document.getElementById('confirmPwd').value;
                
                if (newPwd.length < 3) {
                    showAlert('错误', '新密码至少3位');
                    return;
                }
                if (newPwd !== confirmPwd) {
                    showAlert('错误', '两次输入的密码不一致');
                    return;
                }
                
                const user = getCurrentUser();
                if (!user) return;
                
                try {
                    const response = await fetch(`/updateUser?username=${encodeURIComponent(user.username)}&oldPassword=${encodeURIComponent(oldPwd)}&newPassword=${encodeURIComponent(newPwd)}`);
                    const data = await response.json();
                    if (data.success) {
                        showAlert('成功', '密码修改成功！请重新登录');
                        sessionStorage.removeItem('isLoggedIn');
                        sessionStorage.removeItem('currentUser');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                    } else {
                        showAlert('错误', data.error || '修改失败');
                    }
                } catch (error) {
                    showAlert('错误', '网络错误');
                }
            }, '确认修改');
        }
        
        // 在线人数
        async function showOnlineCount() {
            try {
                const response = await fetch('/online');
                const data = await response.json();
                showAlert('在线人数', `当前在线人数: ${data.count || 0}`);
            } catch (error) {
                showAlert('错误', '获取失败');
            }
        }
        
        // ========== 管理员功能 ==========
        
        // 用户管理（带封禁功能）
        async function showAllUsers() {
            const user = getCurrentUser();
            if (!user || user.username !== 'admin') {
                showAlert('提示', '只有管理员可以查看');
                return;
            }
            
            try {
                const response = await fetch('/getAllUsers?username=admin');
                const data = await response.json();
                if (data.success && data.users) {
                    let html = '<div style="max-height: 400px; overflow-y: auto;">';
                    html += '<table class="user-table">';
                    html += '<tr><th>ID</th><th>用户名</th><th>昵称</th><th>状态</th><th>操作</th></tr>';
                    
                    for (let u of data.users) {
                        if (u.username === 'admin') continue;
                        const status = u.status === 'banned' ? '🔴 封禁' : '🟢 正常';
                        html += `
                            <tr>
                                <td>${u.uid}</td>
                                <td>${u.username}</td>
                                <td>${u.nickname}</td>
                                <td>${status}</td>
                                <td>
                                    <select id="banSelect_${u.username}" class="ban-select">
                                        <option value="">选择操作</option>
                                        <option value="ban_permanent">永久封禁</option>
                                        <option value="ban_1">封禁1小时</option>
                                        <option value="ban_6">封禁6小时</option>
                                        <option value="ban_24">封禁24小时</option>
                                        <option value="unban">解封</option>
                                    </select>
                                    <input type="text" id="reason_${u.username}" class="ban-reason" placeholder="原因">
                                    <button class="ban-btn" onclick="executeBan('${u.username}')">执行</button>
                                </td>
                            </tr>
                        `;
                    }
                    html += '</table></div>';
                    showModal('用户管理', html, null, '关闭');
                }
            } catch (error) {
                showAlert('错误', '获取失败');
            }
        }
        
        // 执行封禁/解封
        window.executeBan = async function(username) {
            const select = document.getElementById(`banSelect_${username}`);
            const action = select.value;
            const reasonInput = document.getElementById(`reason_${username}`);
            const reason = reasonInput.value || '违规操作';
            
            if (!action) {
                showAlert('提示', '请选择操作');
                return;
            }
            
            let apiUrl = '';
            if (action === 'unban') {
                apiUrl = `/banUser?admin=admin&username=${encodeURIComponent(username)}&action=unban`;
            } else if (action === 'ban_permanent') {
                apiUrl = `/banUser?admin=admin&username=${encodeURIComponent(username)}&action=ban&hours=0&reason=${encodeURIComponent(reason)}`;
            } else if (action === 'ban_1') {
                apiUrl = `/banUser?admin=admin&username=${encodeURIComponent(username)}&action=ban&hours=1&reason=${encodeURIComponent(reason)}`;
            } else if (action === 'ban_6') {
                apiUrl = `/banUser?admin=admin&username=${encodeURIComponent(username)}&action=ban&hours=6&reason=${encodeURIComponent(reason)}`;
            } else if (action === 'ban_24') {
                apiUrl = `/banUser?admin=admin&username=${encodeURIComponent(username)}&action=ban&hours=24&reason=${encodeURIComponent(reason)}`;
            }
            
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                if (data.success) {
                    showAlert('成功', data.message);
                    setTimeout(() => showAllUsers(), 1000);
                } else {
                    showAlert('错误', data.error || '操作失败');
                }
            } catch (error) {
                showAlert('错误', '网络错误');
            }
        };
        
        // 查看所有账号密码
        async function showAllUsersWithPassword() {
            const user = getCurrentUser();
            if (!user || user.username !== 'admin') {
                showAlert('提示', '只有管理员可以查看');
                return;
            }
            
            try {
                const response = await fetch('/getAllUsers?username=admin');
                const data = await response.json();
                if (data.success && data.users) {
                    let html = '<div style="max-height: 400px; overflow-y: auto;">';
                    html += '<table class="user-table">';
                    html += '<tr><th>ID</th><th>用户名</th><th>密码</th><th>昵称</th><th>状态</th></tr>';
                    for (let u of data.users) {
                        const status = u.status === 'banned' ? '🔴 封禁' : '🟢 正常';
                        html += `<tr>
                            <td>${u.uid}</td>
                            <td>${u.username}</td>
                            <td style="color:#d32f2f;">${u.password}</td>
                            <td>${u.nickname}</td>
                            <td>${status}</td>
                        </tr>`;
                    }
                    html += '</table></div>';
                    showModal('所有账号信息（含密码）', html, null, '关闭');
                }
            } catch (error) {
                showAlert('错误', '获取失败');
            }
        }
        
        // 注销账号
        async function showDeleteAccount() {
            const user = getCurrentUser();
            if (!user) return;
            
            showModal('⚠️ 注销账号', `
                <p style="color: #d32f2f; margin-bottom: 15px;">此操作不可逆！</p>
                <p>注销后将删除所有数据，确定要继续吗？</p>
                <input type="password" id="confirmPwd" placeholder="请输入密码确认" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 15px;">
            `, async () => {
                const confirmPwd = document.getElementById('confirmPwd').value;
                if (!confirmPwd) {
                    showAlert('错误', '请输入密码');
                    return;
                }
                
                try {
                    const response = await fetch(`/deleteUser?username=${encodeURIComponent(user.username)}&password=${encodeURIComponent(confirmPwd)}`);
                    const data = await response.json();
                    if (data.success) {
                        showAlert('成功', '账号已注销');
                        sessionStorage.clear();
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        showAlert('错误', data.error || '密码错误');
                    }
                } catch (error) {
                    showAlert('错误', '网络错误');
                }
            }, '确认注销');
        }
        
        // 退出登录
        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
        
        // 切换账号
        function switchAccount() {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
        
        // 绑定设置项点击事件
        function bindEvents() {
            document.querySelector('[data-action="avatar"]')?.addEventListener('click', showAvatarSettings);
            document.querySelector('[data-action="password"]')?.addEventListener('click', showPasswordChange);
            document.querySelector('[data-action="online"]')?.addEventListener('click', showOnlineCount);
            document.querySelector('[data-action="gamecenter"]')?.addEventListener('click', () => {
                window.location.href = 'gamecenter.html';
            });
            document.querySelector('[data-action="allusers"]')?.addEventListener('click', showAllUsers);
            document.querySelector('[data-action="alluserspw"]')?.addEventListener('click', showAllUsersWithPassword);
            document.querySelector('[data-action="delete"]')?.addEventListener('click', showDeleteAccount);
            document.querySelector('[data-action="logout"]')?.addEventListener('click', logout);
            document.querySelector('[data-action="switch"]')?.addEventListener('click', switchAccount);
        }
        
        // 底部任务栏切换
        function initTabBar() {
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    if (tabName === 'chat') {
                        window.location.href = 'chat.html';
                    } else if (tabName === 'games') {
                        window.location.href = 'gamecenter.html';
                    }
                });
            });
        }
        
        // 初始化
        displayUserInfo();
        bindEvents();
        initTabBar();
    </script>
</body>
</html>
