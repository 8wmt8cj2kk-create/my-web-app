<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>游戏中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .gamecenter-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }
        
        .gamecenter-header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }
        
        .gamecenter-title {
            flex: 1;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 15px 0 10px 0;
            padding-left: 5px;
            border-left: 3px solid #222;
        }
        
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .game-card {
            background: white;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .game-card:active {
            transform: scale(0.98);
            background: #f8f8f8;
        }
        
        .game-icon {
            width: 55px;
            height: 55px;
            background: #222;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        
        .game-info {
            flex: 1;
        }
        
        .game-name {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin-bottom: 4px;
        }
        
        .game-desc {
            font-size: 11px;
            color: #999;
        }
        
        .ranking-list {
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .ranking-rank {
            width: 30px;
            font-weight: bold;
            font-size: 14px;
            color: #999;
        }
        
        .ranking-rank.top3 {
            color: #ff9800;
        }
        
        .ranking-avatar {
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .ranking-info {
            flex: 1;
        }
        
        .ranking-name {
            font-weight: bold;
            font-size: 14px;
            color: #222;
        }
        
        .ranking-score {
            font-size: 14px;
            font-weight: bold;
            color: #d32f2f;
        }
        
        .game-type-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .game-type-btn {
            flex: 1;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .game-type-btn.active {
            background: #222;
            color: white;
            border-color: #222;
        }
        
        .ranking-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .empty-ranking {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .bottom-tabbar {
            height: 8%;
            min-height: 60px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px;
        }
        
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 0;
            cursor: pointer;
            border-radius: 12px;
        }
        
        .tab-item:active {
            background: #f0f0f0;
        }
        
        .tab-icon {
            font-size: 24px;
        }
        
        .tab-label {
            font-size: 11px;
            color: #999;
        }
        
        .tab-item.active .tab-label {
            color: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gamecenter-container">
        <div class="gamecenter-header">
            <button class="back-btn" onclick="window.location.href='chat.html'">←</button>
            <div class="gamecenter-title">🎮 游戏中心</div>
        </div>
        
        <div class="main-content">
            <div class="section-title">🎯 热门游戏</div>
            <div class="game-list">
                <div class="game-card" onclick="location.href='game.html'">
                    <div class="game-icon">🎮</div>
                    <div class="game-info">
                        <div class="game-name">弹球游戏</div>
                        <div class="game-desc">经典打砖块，鼠标/触摸控制挡板</div>
                    </div>
                    <div style="font-size: 20px; color: #ccc;">›</div>
                </div>
                
                <div class="game-card" onclick="location.href='shooting.html'">
                    <div class="game-icon">🔫</div>
                    <div class="game-info">
                        <div class="game-name">枪战肉鸽</div>
                        <div class="game-desc">水墨风格射击，无限敌人，捡弹药箱</div>
                    </div>
                    <div style="font-size: 20px; color: #ccc;">›</div>
                </div>
            </div>
            
            <div class="section-title">🏆 排行榜</div>
            <div class="game-type-tabs">
                <button id="brickRankBtn" class="game-type-btn active">弹球游戏</button>
                <button id="shootingRankBtn" class="game-type-btn">枪战肉鸽</button>
            </div>
            <div id="rankingContainer" class="ranking-container">
                <div class="empty-ranking">加载中...</div>
            </div>
        </div>
        
        <!-- 底部任务栏 -->
        <script>
    let currentGame = 'brick';
    
    async function loadRanking(gameType) {
        const container = document.getElementById('rankingContainer');
        container.innerHTML = '<div class="empty-ranking">加载中...</div>';
        
        try {
            const response = await fetch(`/getRanking?game=${gameType}`);
            const data = await response.json();
            
            if (data.success && data.ranking.length > 0) {
                let html = '';
                data.ranking.forEach((user, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    if (rank === 1) rankClass = '🥇';
                    else if (rank === 2) rankClass = '🥈';
                    else if (rank === 3) rankClass = '🥉';
                    else rankClass = rank;
                    
                    html += `
                        <div class="ranking-item">
                            <div class="ranking-rank ${rank <= 3 ? 'top3' : ''}">${rankClass}</div>
                            <div class="ranking-avatar">${user.avatar || '👤'}</div>
                            <div class="ranking-info">
                                <div class="ranking-name">${escapeHtml(user.nickname)}</div>
                                <div style="font-size: 11px; color: #999;">@${user.username}</div>
                            </div>
                            <div class="ranking-score">${user.score}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="empty-ranking">暂无排行数据</div>';
            }
        } catch (error) {
            container.innerHTML = '<div class="empty-ranking">加载失败</div>';
        }
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    document.getElementById('brickRankBtn').addEventListener('click', () => {
        currentGame = 'brick';
        document.getElementById('brickRankBtn').classList.add('active');
        document.getElementById('shootingRankBtn').classList.remove('active');
        loadRanking('brick');
    });
    
    document.getElementById('shootingRankBtn').addEventListener('click', () => {
        currentGame = 'shooting';
        document.getElementById('shootingRankBtn').classList.add('active');
        document.getElementById('brickRankBtn').classList.remove('active');
        loadRanking('shooting');
    });
    
    // 高亮当前页面（gamecenter页面）
    function highlightCurrentTab() {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        const gamesTab = document.querySelector('[data-tab="games"]');
        if (gamesTab) gamesTab.classList.add('active');
    }
    
    // 底部任务栏切换
    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', function() {
            const tabName = this.dataset.tab;
            if (tabName === 'chat') {
                window.location.href = 'chat.html';
            } else if (tabName === 'settings') {
                window.location.href = 'chat.html';
                setTimeout(() => {
                    if (typeof initSettings === 'function') {
                        initSettings();
                    }
                    setTimeout(() => {
                        const gearIcon = document.getElementById('gearIcon');
                        if (gearIcon) {
                            gearIcon.click();
                        }
                    }, 100);
                }, 100);
            }
        });
    });
    
    // 高亮当前标签
    highlightCurrentTab();
    
    // 加载排行榜
    loadRanking('brick');
</script>
</body>
</html>
