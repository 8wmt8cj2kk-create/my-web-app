<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 我的应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- 切换标签 -->
            <div class="tab-buttons">
                <button id="loginTab" class="tab-btn active">登录</button>
                <button id="registerTab" class="tab-btn">注册</button>
            </div>

            <!-- 登录表单 -->
            <div id="loginForm" class="form-container">
                <h1>🔐 用户登录</h1>
                
                <div class="input-group">
                    <label>账号</label>
                    <input type="text" id="loginUsername" placeholder="请输入账号">
                </div>

                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberBtn">
                    <label for="rememberBtn">记住账号密码</label>
                </div>

                <button id="loginBtn" class="btn-login">登 录</button>
                <p id="loginErrorMsg" class="error-msg"></p>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" class="form-container" style="display: none;">
                <h1>📝 用户注册</h1>
                
                <div class="input-group">
                    <label>昵称</label>
                    <input type="text" id="regNickname" placeholder="请输入昵称">
                </div>

                <div class="input-group">
                    <label>账号</label>
                    <input type="text" id="regUsername" placeholder="请输入账号">
                </div>

                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="请输入密码">
                </div>

                <div class="input-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
                </div>

                <button id="registerBtn" class="btn-login">注 册</button>
                <p id="registerErrorMsg" class="error-msg"></p>
            </div>

            <div class="back-link">
                <a href="index.html">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
    <script src="settings.js"></script>
</body>
</html>
