<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>枪战肉鸽 - 水墨风格</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #1a1a1a;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        .game-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5f5f0;
            padding: 10px;
        }
        
        .game-wrapper {
            background: white;
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 100%;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            background: #fafaf5;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: none;
            width: 100%;
            height: auto;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            margin-top: 15px;
            background: #f0f0e8;
            border-radius: 40px;
        }
        
        .score-box, .ammo-box {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .score-box span, .ammo-box span {
            color: #d32f2f;
            font-size: 24px;
            margin-left: 8px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .ctrl-btn {
            width: 70px;
            height: 70px;
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.05s linear;
            touch-action: manipulation;
        }
        
        .ctrl-btn:active {
            transform: scale(0.92);
            background: #555;
        }
        
        .shoot-btn {
            background: #d32f2f;
            width: 80px;
            height: 80px;
            font-size: 28px;
        }
        
        .restart-btn {
            background: #222;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .back-link a {
            color: #666;
            text-decoration: none;
        }
        
        .login-required {
            text-align: center;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            .ctrl-btn {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            .shoot-btn {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-wrapper">
            <h2 style="text-align: center; margin-bottom: 10px; color: #333;">⚔️ 枪战肉鸽 🎯</h2>
            
            <div id="loginRequired" style="display: none;">
                <div class="login-required">
                    <p>🔒 需要登录才能玩游戏</p>
                    <button id="goToLogin" class="btn-primary">前往登录</button>
                </div>
            </div>
            
            <div id="gameArea">
                <canvas id="gameCanvas" width="800" height="400"></canvas>
                
                <div class="game-info">
                    <div class="score-box">🎯 杀敌: <span id="score">0</span></div>
                    <div class="ammo-box">🔫 弹药: <span id="ammo">30</span></div>
                </div>
                
                <div class="controls">
                    <button id="leftBtn" class="ctrl-btn">◀</button>
                    <button id="shootBtn" class="ctrl-btn shoot-btn">🔫</button>
                    <button id="rightBtn" class="ctrl-btn">▶</button>
                </div>
                
                <div style="display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
                    <button id="restartBtn" class="restart-btn btn-primary">重新开始</button>
                </div>
            </div>
            
            <div class="back-link">
                <a href="index.html">← 返回首页</a>
            </div>
        </div>
    </div>
    
    <script src="shooting.js"></script>
    <script src="settings.js"></script>
</body>
</html>
